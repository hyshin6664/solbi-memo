<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>솔비 메모</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="솔비 메모">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;color:#1e1b4b;min-height:100vh;background:linear-gradient(135deg,#7c3aed 0%,#ec4899 50%,#f59e0b 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

header{padding:24px 20px 8px;color:#fff;text-align:center}
h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.sub{font-size:12px;font-weight:700;opacity:.92;margin-top:4px}

main{margin:14px;padding:18px 18px 22px;background:rgba(255,255,255,.96);border-radius:22px;box-shadow:0 16px 40px rgba(0,0,0,.18);min-height:calc(100vh - 120px);display:flex;flex-direction:column}

.status{font-size:11px;font-weight:800;padding:8px 12px;border-radius:10px;text-align:center;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.status.ok{background:#dcfce7;color:#14532d}
.status.warn{background:#fef3c7;color:#78350f}
.status.err{background:#fee2e2;color:#7f1d1d}
.status.info{background:#dbeafe;color:#0c4a6e}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* 🎤 음성 입력 전용 UI — 키보드 비활성 */
.mic-area{flex:1;display:flex;flex-direction:column;gap:12px;min-height:240px}
.mic-btn{width:100%;padding:36px 18px;border:none;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 12px 28px rgba(124,58,237,.35);transition:transform .12s,box-shadow .2s;-webkit-appearance:none}
.mic-btn:active{transform:scale(.97)}
.mic-btn .mic-ico{font-size:42px;line-height:1}
.mic-btn.listening{background:linear-gradient(135deg,#dc2626,#f59e0b);animation:pulseMic 1.1s ease-in-out infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}50%{box-shadow:0 0 0 18px rgba(220,38,38,0)}}
.mic-btn .mic-label{font-size:18px;font-weight:900;letter-spacing:-.3px}
.mic-btn .mic-hint{font-size:11px;font-weight:700;opacity:.9;margin-top:2px}

.transcript{flex:1;min-height:140px;padding:16px;border:1.5px solid #ddd6fe;border-radius:14px;background:#faf5ff;font-size:17px;line-height:1.6;color:#1e1b4b;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-family:inherit;-webkit-user-select:text;user-select:text}
.transcript:empty::before{content:"🎤 위 마이크 버튼을 눌러 말하면 여기에 텍스트가 채워집니다.";color:#a78bfa;font-weight:600;font-size:14px;font-style:italic}
.transcript .interim{color:#a78bfa;font-style:italic}

.mic-row{display:flex;gap:8px;margin-top:-4px}
.btn-mini{flex:1;padding:10px 8px;border:1.5px solid #ddd6fe;border-radius:10px;background:#fff;color:#6b21a8;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;-webkit-appearance:none}
.btn-mini:active{background:#f5f3ff;transform:scale(.97)}
.btn-mini.danger{color:#dc2626;border-color:#fecaca}

.attach-row{display:flex;gap:8px;margin-top:10px}
.attach-btn{flex:1;padding:14px 8px;border:1.5px dashed #c4b5fd;border-radius:12px;background:rgba(168,85,247,.06);color:#6b21a8;font-size:13px;font-weight:800;text-align:center;cursor:pointer;transition:all .15s}
.attach-btn:active{background:rgba(168,85,247,.18);transform:scale(.97)}
.attach-btn input{display:none}

.attached-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.att-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;font-size:12.5px}
.att-item .nm{flex:1;font-weight:700;color:#4c1d95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-item .sz{color:#7c3aed;font-size:11px;font-weight:700}
.att-item button{background:rgba(220,38,38,.12);border:none;color:#dc2626;cursor:pointer;border-radius:6px;padding:4px 8px;font-weight:800;font-size:11px}

.save-row{display:flex;gap:8px;margin-top:14px}
.btn{font-family:inherit;font-size:16px;font-weight:900;border:none;cursor:pointer;border-radius:14px;padding:16px 18px;transition:transform .12s,box-shadow .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none}
.btn:active{transform:scale(.97)}
.btn.primary{flex:1;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;box-shadow:0 8px 20px rgba(124,58,237,.35)}
.btn.ghost{background:#f3f4f6;color:#4b5563;padding:16px 16px}

.queue-info{margin-top:14px;padding:10px 14px;background:#fef3c7;border-left:3px solid #d97706;border-radius:8px;font-size:12px;color:#78350f;font-weight:700;display:none}
.queue-info.show{display:block}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:rgba(15,23,42,.94);color:#fff;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;transition:all .3s;z-index:200;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{text-align:center;font-size:10.5px;color:#fff;opacity:.7;padding:12px 20px;font-weight:700}
</style>
</head>
<body>

<header>
  <h1>📝 솔비 메모</h1>
  <div class="sub">텍스트 · 사진 · 위치 · 즉시 저장</div>
</header>

<main>

  <div class="status info" id="status">
    <span class="dot"></span><span id="statusText">준비됨</span>
  </div>

  <div class="mic-area">
    <button class="mic-btn" id="btnMic" type="button">
      <span class="mic-ico" id="micIco">🎤</span>
      <span>
        <span class="mic-label" id="micLabel">눌러서 말하기</span><br>
        <span class="mic-hint" id="micHint">키보드 없이 음성만 — 한국어 자동 인식</span>
      </span>
    </button>
    <div class="transcript" id="transcript" aria-live="polite"></div>
    <div class="mic-row">
      <button class="btn-mini" id="btnAppend" type="button">＋ 이어서 말하기</button>
      <button class="btn-mini danger" id="btnReset" type="button">↻ 다시 시작</button>
    </div>
  </div>

  <div class="attach-row">
    <label class="attach-btn">
      📷 사진
      <input type="file" id="fImg" accept="image/*" capture="environment" multiple>
    </label>
    <label class="attach-btn">
      📎 파일
      <input type="file" id="fAny" multiple>
    </label>
  </div>

  <div class="attached-list" id="attList"></div>

  <div class="save-row">
    <button class="btn primary" id="btnSave">💾 저장</button>
    <button class="btn ghost" id="btnClear">✕</button>
  </div>

  <div class="queue-info" id="qInfo">
    📥 대기 중 메모 <b id="qCount">0</b>건 — 온라인 복귀 시 자동 전송
  </div>

</main>

<footer>CDN &amp; Cloud is by Solbox.. · 솔비 메모 <b style="color:#7c3aed">v2.2</b> (2026-05-20 · 저장 누를 때까지 무한 듣기 + STT 중복 dedup)</footer>

<div class="toast" id="toast"></div>

<script>
'use strict';
const SOLBI_URL = 'https://script.google.com/a/macros/solbox.com/s/AKfycbwDV-kuZ7YC3xLIaomLzCxQ0doaBAmWVKHfVyZnwlnwUbAvne_xRSZHauLJmqF0LTC6/exec?api=saveMemo';
const DASH_SECRET = 'sb_memo_2026_h7y3sh1n_x9k2m4n8p';
const Q_KEY = 'solbi-memo-queue-v1';
const LOC_KEY = 'solbi-memo-lastloc-v1';

const $ = id => document.getElementById(id);
let attachments = [];
let currentLocation = null;
let finalTranscript = '';  // 최종 누적 음성 텍스트
let recog = null;
let listening = false;

function setStatus(text, kind){
  $('status').className = 'status ' + (kind||'info');
  $('statusText').textContent = text;
}
function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), ms||2400);
}
function fmtSize(n){
  if (n < 1024) return n+'B';
  if (n < 1024*1024) return (n/1024).toFixed(1)+'KB';
  return (n/1024/1024).toFixed(2)+'MB';
}
function pad(n){ return String(n).padStart(2,'0'); }
function nowStamp(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
}
function blobToB64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res((r.result+'').split(',')[1] || '');
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}

// === 위치 자동 (요구사항: 어떠한 경우에도 같이 저장) ===
function loadLastLoc(){
  try {
    const raw = localStorage.getItem(LOC_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts > 30*60*1000) return null; // 30분 TTL
    return obj;
  } catch { return null; }
}
function saveLastLoc(loc){
  try { localStorage.setItem(LOC_KEY, JSON.stringify(Object.assign({ts:Date.now()}, loc))); } catch {}
}
function fetchLocation(){
  // 캐시 우선
  const cached = loadLastLoc();
  if (cached) {
    currentLocation = {lat:cached.lat, lng:cached.lng, accuracy:cached.accuracy, capturedAt:new Date(cached.ts).toISOString()};
  }
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => {
      currentLocation = {lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy), capturedAt:new Date().toISOString()};
      saveLastLoc(currentLocation);
    },
    err => { /* 권한 거부·실패 무시 — 캐시 있으면 그거 사용, 없으면 null */ },
    {maximumAge: 60*1000, timeout: 15000, enableHighAccuracy: true}
  );
}

// === 🎤 음성 인식 (Web Speech API · 키보드 X) ===
function renderTranscript(interim){
  const el = $('transcript');
  if (interim) {
    el.innerHTML = (finalTranscript ? finalTranscript.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]) + ' ' : '') + '<span class="interim">' + interim.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]) + '</span>';
  } else {
    el.textContent = finalTranscript;
  }
}
function setMicState(state){
  const btn = $('btnMic');
  const ico = $('micIco');
  const lbl = $('micLabel');
  const hint = $('micHint');
  if (state === 'listening') {
    btn.classList.add('listening');
    ico.textContent = '⏹';
    lbl.textContent = '말하는 중... (탭하면 종료)';
    hint.textContent = '말 멈추면 자동 종료';
  } else {
    btn.classList.remove('listening');
    ico.textContent = '🎤';
    lbl.textContent = finalTranscript ? '＋ 더 말하기' : '눌러서 말하기';
    hint.textContent = '키보드 없이 음성만 — 한국어 자동 인식';
  }
}
function makeRecog(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ko-KR';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  let interim = '';
  // 🐛 fix 2026-05-20 v2: prefix-dedup 알고리즘 — Android Chrome이 누적 prefix를 final로 재emit하는 패턴 처리
  // 패턴: "오영택시" → "오영택시 관련해서" → "오영택시 관련해서 엔진" ... 모두 isFinal:true
  // 단순 join 시 "오영택시 오영택시 관련해서 오영택시 관련해서 엔진" 같은 중복 발생
  // 해결: 마지막 final이 새 final의 prefix면 더 긴 버전으로 교체, 부분집합이면 무시, 둘 다 아니면 push
  r.onresult = (e) => {
    const finals = [];
    interim = '';
    for (let i = 0; i < e.results.length; i++) {
      const raw = (e.results[i][0].transcript || '').trim();
      if (!raw) continue;
      if (e.results[i].isFinal) {
        const last = finals.length ? finals[finals.length-1] : '';
        if (last && raw.startsWith(last)) {
          // 새 final이 이전 final의 확장형 — 교체
          finals[finals.length-1] = raw;
        } else if (last && last.startsWith(raw)) {
          // 새 final이 이전 final의 부분집합 — 무시 (이미 더 긴 게 있음)
        } else {
          finals.push(raw);
        }
      } else {
        interim += ' ' + raw;
      }
    }
    finalTranscript = finals.join(' ').trim();
    renderTranscript(interim.trim());
  };
  // 🎤 2026-05-20 v2.2 — 저장 버튼 누를 때까지 무한 듣기 (침묵·끊김 무시, UI 깜빡임 X, 안내 X)
  // 무한 루프 방지: 10초 내 10회 이상 재시작되면 안전 종료
  let restartTimes = [];
  r.onend = () => {
    if (userStopped) {
      // 사용자가 진짜 종료 (저장·중지·리셋)
      listening = false;
      setMicState('idle');
      renderTranscript('');
      userStopped = false;
      restartTimes = [];
      return;
    }
    // 무한 루프 방지
    const now = Date.now();
    restartTimes = restartTimes.filter(t => now - t < 10000);
    if (restartTimes.length >= 10) {
      // 10초 내 10회 이상 = 마이크 권한·하드웨어 문제 — 안전 종료
      listening = false;
      setMicState('idle');
      toast('🎤 음성 인식이 불안정합니다 — 다시 시도해주세요');
      return;
    }
    restartTimes.push(now);
    // listening 상태 유지 (UI 깜빡임 X) + 재시작
    const tryRestart = (delay) => {
      setTimeout(() => {
        try { r.start(); } catch(e) {
          if (delay < 1600) tryRestart(delay * 2);
        }
      }, delay);
    };
    tryRestart(50);
  };
  r.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      userStopped = true;
      listening = false;
      setMicState('idle');
      toast('🎤 마이크 권한을 허용해주세요');
      setStatus('🎤 마이크 권한 거부됨', 'err');
    }
    // no-speech, aborted, audio-capture, network 등 일시 오류 모두 조용히 무시
    // (onend에서 자동 재시작됨)
  };
  return r;
}
let userStopped = false;
function startListen(){
  if (!recog) recog = makeRecog();
  if (!recog) {
    toast('이 브라우저는 음성 인식 미지원 — Chrome 권장');
    setStatus('❌ 음성 인식 미지원', 'err');
    return;
  }
  if (listening) return; // 이미 듣는 중 — 무시
  try {
    userStopped = false;
    recog.start();
    listening = true;
    setMicState('listening');
  } catch(e) {/* 이미 실행 중 무시 */}
}
function stopListen(){
  if (recog && listening) {
    userStopped = true;
    try { recog.stop(); } catch(_){}
  }
}
$('btnMic').addEventListener('click', () => {
  if (listening) stopListen();
  else startListen();
});
$('btnAppend').addEventListener('click', () => {
  if (!listening) startListen();
});
$('btnReset').addEventListener('click', () => {
  finalTranscript = '';
  renderTranscript('');
  setMicState('idle');
  if (listening) stopListen();
});

// === 첨부 ===
function renderAtt(){
  const wrap = $('attList');
  wrap.innerHTML = '';
  attachments.forEach((a, i) => {
    const row = document.createElement('div');
    row.className = 'att-item';
    const icon = a.type.startsWith('image/') ? '🖼' : a.type.startsWith('video/') ? '🎬' : '📎';
    row.innerHTML = '<span style="font-size:18px">'+icon+'</span><div class="nm"></div><div class="sz"></div><button data-i="'+i+'">제거</button>';
    row.querySelector('.nm').textContent = a.name;
    row.querySelector('.sz').textContent = fmtSize(a.size);
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      attachments.splice(+b.dataset.i, 1);
      renderAtt();
    });
  });
}
function addFiles(list){
  for (const f of list) {
    attachments.push({name:f.name, blob:f, type:f.type||'application/octet-stream', size:f.size});
  }
  renderAtt();
}
$('fImg').addEventListener('change', e => addFiles(e.target.files));
$('fAny').addEventListener('change', e => addFiles(e.target.files));

// === 큐 (오프라인 / 실패 보관) ===
function loadQueue(){
  try { return JSON.parse(localStorage.getItem(Q_KEY) || '[]'); } catch { return []; }
}
function saveQueue(q){
  try { localStorage.setItem(Q_KEY, JSON.stringify(q)); } catch {}
}
function refreshQueueUI(){
  const q = loadQueue();
  $('qCount').textContent = q.length;
  $('qInfo').classList.toggle('show', q.length > 0);
}

// === 전송 ===
async function sendOne(payload){
  // text/plain → CORS preflight 회피 (response opaque, 낙관적 처리)
  await fetch(SOLBI_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
}

async function flushQueue(){
  if (!navigator.onLine) return;
  const q = loadQueue();
  if (q.length === 0) return;
  setStatus('☁ 대기 메모 '+q.length+'건 전송 중...', 'info');
  const remain = [];
  for (const item of q) {
    try {
      await sendOne(item);
    } catch(e) {
      remain.push(item);
    }
  }
  saveQueue(remain);
  refreshQueueUI();
  if (remain.length === 0) {
    setStatus('✅ 모두 전송 완료', 'ok');
    toast('☁ 대기 메모 전송 완료');
  } else {
    setStatus('⚠ '+remain.length+'건 재시도 대기', 'warn');
  }
}

// === 저장 ===
$('btnSave').addEventListener('click', async () => {
  if (listening) stopListen();
  const text = (finalTranscript || '').trim();
  if (!text && attachments.length === 0) {
    toast('빈 메모는 저장 불가');
    return;
  }
  // 위치 한 번 더 최신화 시도 (비동기, 결과 안 기다림)
  fetchLocation();

  setStatus('☁ 전송 중...', 'info');

  // 첨부 base64
  const files = [];
  try {
    for (const a of attachments) {
      const b64 = await blobToB64(a.blob);
      files.push({name:a.name, mime:a.type, base64:b64});
    }
  } catch(e) {
    setStatus('❌ 첨부 인코딩 실패', 'err');
    toast('첨부 인코딩 실패');
    return;
  }

  const payload = {
    text: text,
    source: 'solbi-memo-pwa',
    files: files,
    location: currentLocation, // 자동, 없으면 null
    dashSecret: DASH_SECRET,
    capturedAt: new Date().toISOString()
  };

  // 낙관적 UI: 입력 즉시 비움
  const snapshotText = text;
  finalTranscript = '';
  renderTranscript('');
  setMicState('idle');
  attachments = [];
  renderAtt();

  if (navigator.onLine) {
    try {
      await sendOne(payload);
      setStatus('✅ 저장 완료', 'ok');
      toast('✅ 솔비 메모큐 저장 완료');
    } catch(e) {
      // 네트워크 죽으면 큐로
      const q = loadQueue();
      q.push(payload);
      saveQueue(q);
      refreshQueueUI();
      setStatus('📥 오프라인 — 대기 큐에 보관', 'warn');
      toast('대기 큐에 보관됨');
    }
  } else {
    const q = loadQueue();
    q.push(payload);
    saveQueue(q);
    refreshQueueUI();
    setStatus('📥 오프라인 — 대기 큐에 보관 ('+q.length+')', 'warn');
    toast('오프라인 — 대기 큐에 보관');
  }
});

// 비우기: 더블탭 안전장치 (1.5초 내 두 번 탭)
let _clearArm = 0;
$('btnClear').addEventListener('click', () => {
  if (!finalTranscript && attachments.length === 0) return;
  const now = Date.now();
  if (now - _clearArm < 1500) {
    if (listening) stopListen();
    finalTranscript = '';
    renderTranscript('');
    setMicState('idle');
    attachments = [];
    renderAtt();
    _clearArm = 0;
  } else {
    _clearArm = now;
    toast('한 번 더 탭하면 비웁니다');
  }
});

// === 온라인 복귀 자동 flush ===
window.addEventListener('online', () => {
  setStatus('🌐 온라인 복귀 — 대기 큐 flush', 'info');
  setTimeout(flushQueue, 500);
});
window.addEventListener('offline', () => {
  setStatus('📥 오프라인 — 저장은 됩니다 (큐 보관)', 'warn');
});

// === Service Worker 등록 ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// === 초기 ===
fetchLocation();
refreshQueueUI();
// 페이지 진입 시 대기 큐 자동 flush
if (navigator.onLine) setTimeout(flushQueue, 1500);
setStatus(navigator.onLine ? '✓ 준비됨' : '📥 오프라인 — 큐 모드', navigator.onLine ? 'ok' : 'warn');
</script>

</body>
</html>
